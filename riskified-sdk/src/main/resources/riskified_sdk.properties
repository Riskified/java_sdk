# Your shop domain as registered to Riskified
shopUrl=

# Your authentication token string
authKey=

# SANDBOX / PRODUCTION
environment=

# NONE / IGNORE_MISSING / ALL
validation=

# only applicable for PSD2 merchants, please consult with your technical contact at Riskified
#false / true 
enable_old_advise_response=

# Deprecated, removed in 7.0.0. Sends requests in the 6.6.x format instead of the documented one,
# to roll back the 6.7.0 format changes without downgrading the SDK.
#false / true
legacy_wire_format=

# Proxy configuration
#proxyUrl=<proxy_url>
#proxyPort=<proxy_port>
#proxyUsername=<proxy_username>
#proxyPassword=<proxy_password>